name: Create stable branch from v1.1.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create branch from v1.1.0 stable commit
        run: |
          git fetch --all
          git checkout 6cd483d
          git switch -c stable-signed-v1.1.0
          git push origin stable-signed-v1.1.0

      - name: Verify branch
        run: |
          echo "Stable source commit:"
          git rev-parse 6cd483d
          echo "New branch:"
          git rev-parse stable-signed-v1.1.0
