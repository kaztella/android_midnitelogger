name: Create MidNite Logger Keystore

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create keystore
        run: |
          keytool -genkeypair \
            -keystore midnite-logger.jks \
            -alias midnitelogger \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "MidniteLogger_2026" \
            -keypass "MidniteLogger_2026" \
            -dname "CN=MidNite Logger"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: midnite-logger-keystore
          path: midnite-logger.jks
